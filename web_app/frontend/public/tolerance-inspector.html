<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CAD-RAG 公差資料檢驗台</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#171717;color:#e5e5e5;font:13px "Segoe UI",sans-serif}button,input,select{font:inherit}
    header{height:58px;padding:0 22px;background:#202020;border-bottom:1px solid #363636;display:flex;align-items:center;justify-content:space-between;gap:16px}
    h1{font-size:16px;margin:0}.sub{color:#999;font-size:11px;margin-top:3px}.toolbar{display:flex;gap:8px;align-items:center}
    input,select,.btn{background:#262626;color:#ddd;border:1px solid #444;border-radius:4px;padding:7px 10px}.btn{cursor:pointer}.btn:hover{border-color:#2563eb}.primary{background:#2563eb;border-color:#2563eb;color:#fff}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;padding:14px 22px}.stat{background:#202020;border:1px solid #333;border-radius:5px;padding:10px}.stat strong{font-size:20px;color:#60a5fa}.stat span{display:block;color:#999;font-size:11px;margin-top:4px}
    .filters{padding:0 22px 12px;display:flex;gap:8px;flex-wrap:wrap}.filters button.active{background:#2563eb;border-color:#2563eb;color:#fff}
    main{padding:0 22px 24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}.card{background:#202020;border:1px solid #333;border-radius:6px;overflow:hidden}.card:hover{border-color:#2563eb}
    .card-head{padding:9px 11px;border-bottom:1px solid #333;display:flex;justify-content:space-between;gap:8px}.model{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{font-size:10px;padding:2px 6px;border:1px solid #475569;border-radius:3px;color:#93c5fd}.badge.bad{color:#fca5a5;border-color:#7f1d1d}.badge.good{color:#86efac;border-color:#166534}
    .card-body{display:flex;gap:12px;padding:11px}.thumb{width:150px;height:105px;background:#111;border:1px solid #383838;border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}.thumb img{width:100%;height:100%;object-fit:contain}.empty{color:#666;text-align:center;font-size:11px;padding:12px}.meta{min-width:0;flex:1;display:grid;gap:6px;align-content:start}.tol{font-size:15px;font-weight:700;color:#facc15}.muted{color:#999;font-size:11px}.reason{padding:0 11px 11px;color:#b8c4d4;font-size:11px;line-height:1.45}.inference{margin-top:6px;padding:6px;background:#171717;border-left:2px solid #2563eb;color:#cbd5e1;font-size:10px;line-height:1.45}.pages{display:flex;justify-content:center;gap:10px;align-items:center;padding:18px}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:100;align-items:center;justify-content:center;padding:20px}.overlay.open{display:flex}.dialog{width:min(1500px,98vw);height:min(900px,94vh);background:#171717;border:1px solid #444;border-radius:7px;display:flex;flex-direction:column;overflow:hidden}.dialog-head{padding:10px 14px;background:#202020;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}.dialog-main{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0;flex:1}.viewer{background:#0b0b0b;position:relative;overflow:auto;display:flex;align-items:center;justify-content:center}.viewer img{max-width:100%;max-height:100%;object-fit:contain}.viewer iframe{width:100%;height:100%;border:0;background:white}.side{border-left:1px solid #333;overflow:auto;padding:12px}.side h2{font-size:13px;margin:12px 0 7px}.tol-row{width:100%;text-align:left;background:#222;color:#ddd;border:1px solid #383838;border-radius:4px;padding:8px;margin-bottom:7px;cursor:pointer}.tol-row:hover,.tol-row.active{border-color:#2563eb;background:#1e293b}.tol-row strong{color:#facc15}.raw{font-family:Consolas,monospace;color:#93c5fd;word-break:break-all}.quality{font-size:10px;margin-top:4px;color:#86efac}.quality.review{color:#fbbf24}.quality.reject{color:#f87171}.viewer-actions{position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:2}.loading{padding:50px;text-align:center;color:#888}
    @media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.dialog-main{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid #333;max-height:42vh}.toolbar input{width:180px}}
  </style>
</head>
<body>
  <header>
    <div><h1>CAD-RAG 歷史公差資料檢驗台</h1><div class="sub" id="subtitle">載入資料中</div></div>
    <div class="toolbar"><input id="search" placeholder="圖號、公差、類別"/><select id="pageSize"><option>24</option><option selected>36</option><option>60</option></select><a class="btn" href="/">返回主系統</a></div>
  </header>
  <section class="stats">
    <div class="stat"><strong id="totalCases">-</strong><span>全部案例</span></div>
    <div class="stat"><strong id="eligibleCases">-</strong><span>可用於 RAG 的已驗證案例</span></div>
    <div class="stat"><strong id="drawings">-</strong><span>來源圖面</span></div>
    <div class="stat"><strong id="unverified">-</strong><span>待人工驗證</span></div>
  </section>
  <div class="filters" id="filters">
    <button class="btn active" data-category="ALL">全部</button><button class="btn" data-category="GENERAL_LINEAR">線性</button><button class="btn" data-category="BEARING_FIT">軸承／圓柱</button><button class="btn" data-category="PRESS_FIT">壓配／孔</button><button class="btn" data-category="GROOVE_CHAMFER">槽／倒角／圓角</button><button class="btn" data-category="OVERALL_LENGTH">總長／軸肩</button>
  </div>
  <main><div class="grid" id="grid"><div class="loading">正在讀取案例</div></div><div class="pages"><button class="btn" id="prev">上一頁</button><span id="pageText">-</span><button class="btn" id="next">下一頁</button></div></main>

  <div class="overlay" id="overlay">
    <div class="dialog">
      <div class="dialog-head"><div><strong id="dialogTitle">-</strong><div class="sub" id="dialogSummary">-</div></div><button class="btn" id="close">關閉</button></div>
      <div class="dialog-main">
        <div class="viewer"><div class="viewer-actions"><button class="btn primary" id="showPdf">PDF</button><button class="btn" id="showSvg">向量圖／定位</button></div><iframe id="pdfViewer" title="PDF viewer"></iframe><img id="svgViewer" alt="DXF vector preview" hidden/></div>
        <aside class="side"><div id="detailStatus" class="muted">讀取圖面內容中</div><h2>特徵公差</h2><div id="toleranceList"></div><h2>圖面一般公差</h2><div id="defaultList"></div><h2>被排除的可疑文字</h2><div id="rejectedSummary" class="muted">-</div></aside>
      </div>
    </div>
  </div>

  <script>
    const state={page:1,pageSize:36,category:'ALL',search:'',pages:1,cases:[],activeCase:null,details:null};
    const $=id=>document.getElementById(id); const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function json(url){const response=await fetch(url);if(!response.ok)throw new Error(`${response.status} ${await response.text()}`);return response.json()}
    async function loadStats(){const d=await json('/api/tolerance/stats');$('totalCases').textContent=d.total_cases.toLocaleString();$('eligibleCases').textContent=(d.retrieval_eligible_cases||0).toLocaleString();$('drawings').textContent=d.total_drawings.toLocaleString();$('unverified').textContent=((d.feature_linkage||{}).UNRESOLVED_FEATURE||0).toLocaleString()}
    async function loadCases(){
      $('grid').innerHTML='<div class="loading">正在讀取案例</div>';const p=new URLSearchParams({page:state.page,page_size:state.pageSize});if(state.category!=='ALL')p.set('category',state.category);if(state.search)p.set('search',state.search);
      try{const d=await json('/api/tolerance/cases?'+p);state.pages=d.total_pages;state.cases=d.cases;$('subtitle').textContent=`篩選後 ${d.total_count.toLocaleString()} 筆；未驗證案例不會參與 RAG 推薦`;$('pageText').textContent=`${d.page} / ${d.total_pages}`;$('prev').disabled=d.page<=1;$('next').disabled=d.page>=d.total_pages;renderCards()}catch(e){$('grid').innerHTML=`<div class="loading">讀取失敗：${esc(e.message)}</div>`}
    }
    function qualityBadge(c){const s=c.verification_status||'UNVERIFIED';const good=c.retrieval_eligible?'good':'bad';return `<span class="badge ${good}">${esc(s)}</span>`}
    function renderCards(){if(!state.cases.length){$('grid').innerHTML='<div class="loading">沒有符合條件的案例</div>';return}$('grid').innerHTML=state.cases.map((c,i)=>{const featureLabel=c.feature_identity_verified?c.feature_type:`未定位（候選：${(c.candidate_feature_types||[]).join('、')||'無'}）`;return `<article class="card"><div class="card-head"><div class="model">${esc(c.model_name)}</div>${qualityBadge(c)}</div><div class="card-body"><button class="thumb" data-open="${i}">${c.preview_image_url?`<img loading="lazy" src="${esc(c.preview_image_url)}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'empty',textContent:'圖面渲染失敗'}))"/>`:`<span class="empty">無來源圖面</span>`}</button><div class="meta"><span class="badge">${esc(featureLabel)}</span><div>${esc(c.dim_summary)}</div><div class="tol">${esc(c.formatted_tolerance)}</div><div class="muted">${esc(c.verification_status)} · 信心度 ${Math.round((c.confidence||0)*100)}%</div></div></div><div class="reason">${esc(c.description)}</div></article>`}).join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openCase(Number(b.dataset.open)))}
    async function openCase(index){state.activeCase=state.cases[index];$('overlay').classList.add('open');$('dialogTitle').textContent=state.activeCase.model_name;$('dialogSummary').textContent=`${state.activeCase.inferred_role} · ${state.activeCase.formatted_tolerance}`;$('detailStatus').textContent='讀取 DXF entity 與公差診斷中';$('toleranceList').innerHTML='';$('defaultList').innerHTML='';showPdf();if(!state.activeCase.details_url){$('detailStatus').textContent='這是種子案例，沒有來源圖面';return}try{state.details=await json(state.activeCase.details_url);renderDetails()}catch(e){$('detailStatus').textContent='詳細資料讀取失敗：'+e.message}}
    function showPdf(){if(!state.activeCase)return;$('svgViewer').hidden=true;$('pdfViewer').hidden=false;$('pdfViewer').src=state.activeCase.pdf_url||'about:blank'}
    function showSvg(handle=''){if(!state.activeCase)return;$('pdfViewer').hidden=true;$('svgViewer').hidden=false;$('svgViewer').src=(state.activeCase.svg_url||'')+(handle?`?highlight=${encodeURIComponent(handle)}`:'')}
    function inferenceSummary(d){const inf=d.feature_inference_2d||{};if(!inf.status)return '';const ranked=(inf.candidates||[]).slice(0,3);const names=ranked.map(x=>`${x.feature_type} ${Math.round((x.confidence||0)*100)}%`).join(' / ');const reasons=ranked[0]?.evidence?.slice(-2).join('；')||'證據不足';const selected=inf.feature_type?`分類：${inf.feature_type}`:'尚未唯一分類';return `<div class="inference"><strong>2D 推斷 ${esc(inf.status)}</strong> · ${esc(selected)}<br>${esc(names)}<br>${esc(reasons)}</div>`}
    function row(d,index,prefix='tol'){const quality=d.validation_status==='AUTO_VALIDATED'?'':d.validation_status==='REJECTED'?'reject':'review';return `<button class="tol-row" data-${prefix}="${index}"><div><strong>${esc(d.formatted_tolerance)}</strong> · ${esc(d.dimension_category)}</div><div>${esc(d.prefix)}${Number(d.nominal_value||0).toFixed(3)} mm · layer ${esc(d.layer)}</div><div class="raw">${esc(d.raw_text||'<DXF measured value>')}</div><div class="quality ${quality}">${esc(d.validation_status)} · ${Math.round((d.extraction_confidence||0)*100)}% · handle ${esc(d.entity_handle||'-')}</div>${inferenceSummary(d)}</button>`}
    function renderDetails(){const d=state.details;$('detailStatus').textContent=`DXF 內 ${d.total_dimensions_count} 個尺寸候選，${d.total_tolerances_count} 個特徵公差`;$('toleranceList').innerHTML=d.tolerances.length?d.tolerances.map((x,i)=>row(x,i)).join(''):'<div class="muted">未找到可驗證的特徵公差</div>';$('defaultList').innerHTML=d.drawing_defaults.length?d.drawing_defaults.map((x,i)=>row(x,i,'default')).join(''):'<div class="muted">無</div>';$('rejectedSummary').textContent=`${d.rejected_items.length} 筆備註／圖框文字已排除，不會進入 RAG。`;document.querySelectorAll('[data-tol]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tol-row').forEach(x=>x.classList.remove('active'));b.classList.add('active');const item=d.tolerances[Number(b.dataset.tol)];showSvg(item.entity_handle)})}
    $('showPdf').onclick=showPdf;$('showSvg').onclick=()=>showSvg();$('close').onclick=()=>{$('overlay').classList.remove('open');$('pdfViewer').src='about:blank'};$('overlay').onclick=e=>{if(e.target===$('overlay'))$('close').click()};
    $('prev').onclick=()=>{if(state.page>1){state.page--;loadCases()}};$('next').onclick=()=>{if(state.page<state.pages){state.page++;loadCases()}};$('pageSize').onchange=e=>{state.pageSize=Number(e.target.value);state.page=1;loadCases()};let timer;$('search').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{state.search=e.target.value.trim();state.page=1;loadCases()},300)};document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-category]').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.category=b.dataset.category;state.page=1;loadCases()});
    Promise.all([loadStats(),loadCases()]).catch(e=>console.error(e));
  </script>
</body>
</html>
